name = "odubo-app"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

# Pages configuration (serve assets from static so _worker.js and index.html are at root)
pages_build_output_dir = ".vercel/output/static"

# D1 Database configuration for migrations
[[d1_databases]]
binding = "DB"
database_name = "odubo"
database_id = "c63953e2-82b5-407f-b10d-831fc7e5e85e"
migrations_dir = "./database/migrations"

[env.production]
[env.production.vars]
NODE_ENV = "production"
NEXT_PUBLIC_SITE_URL = "https://odubo.studio"
CLOUDFLARE_R2_PUBLIC_URL = "https://media.odubo.studio"
CLOUDFLARE_R2_BUCKET_NAME = "odubo-studio-media"

[[env.production.d1_databases]]
binding = "DB"
database_name = "odubo"
database_id = "c63953e2-82b5-407f-b10d-831fc7e5e85e"

migrations_dir = "./database/migrations"

[[env.production.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "odubo-studio-media"
preview_bucket_name = "odubo-studio-media"

# Secrets are set via dashboard or CLI:
# wrangler pages secret put JWT_SECRET --project-name=odubo-app
# wrangler pages secret put CLOUDFLARE_R2_ACCESS_KEY_ID  --project-name=odubo-app
# wrangler pages secret put CLOUDFLARE_R2_SECRET_ACCESS_KEY --project-name=odubo-app
# wrangler pages secret put SHOPIFY_STORE_URL --project-name=odubo-app
# wrangler pages secret put NEXT_PUBLIC_SHOPIFY_API_KEY --project-name=odubo-app

# Separate Node-compatible worker for media transcoding (to be wired up)
[[env.production.services]]
binding = "NODE_TRANSCODER"
service = "odubo-transcoder"
