# Wrangler configuration for Odubo
# Used for managing Cloudflare D1 database migrations and queries

name = "odubo"
compatibility_date = "2024-01-01"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "odubo"
database_id = "c63953e2-82b5-407f-b10d-831fc7e5e85e"

# R2 Bucket binding (optional, for direct Wrangler operations)
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "odubo-media"
