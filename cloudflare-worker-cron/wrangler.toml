# Cloudflare Worker for scheduled jobs
name = "odubo-cron-worker"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Every 6 hours: Arsenal deployment sync
[triggers]
crons = ["*/15 * * * *"]

[vars]
ARSENAL_SYNC_URL = "https://odubo.studio/api/arsenal/sync"

# Add secrets via: wrangler secret put CRON_SECRET
